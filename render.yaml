services:
  - type: web
    name: my-portfolio
    env: node
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "node backend/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
